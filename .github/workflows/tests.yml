# Intégration continue d'ocr-md : tests automatisés sur Windows, macOS et Linux.
# - Windows et macOS : niveaux 1 (moteur factice) et 2 (moteurs OCR réels du système).
# - Linux : niveau 1 seulement (pas de moteur OCR du système).
# Python 3.12 est installé et géré par uv, comme sur les postes (EX-09).
#
# Passe complète (« nocturne ») : chaque nuit, sur les étiquettes v* et à la demande.
# - Windows : installation du module OCR français (environ 15 minutes) et tests réels en
#   fr-FR ; aux autres envois, tests réels avec le moteur en-US présent sur l'image.
# - Toutes plateformes : test mémoire sur un lot de 20 fichiers de 500 pages (10 fichiers
#   de 200 pages aux autres envois).
name: tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest      # Apple Silicon
          - macos-15-intel    # Mac Intel (PV-08 b)
          - ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
      PYTHONIOENCODING: utf-8
      PASSE_COMPLETE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"

      - name: Paramètres de la passe
        shell: bash
        run: |
          if [ "$PASSE_COMPLETE" = "true" ]; then
            echo "OCR_MD_ESSAI_LOT=complet" >> "$GITHUB_ENV"
            echo "Passe complète : module fr-FR (Windows) et lot mémoire de 20 x 500 pages"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "OCR_MD_LANGUE_ESSAI=en-US" >> "$GITHUB_ENV"
            echo "Passe courante : moteur Windows réel en en-US"
          fi

      # Passe complète seulement : le module OCR français n'est pas présent sur l'image
      # Windows Server de GitHub ; le runner étant administrateur, on l'installe.
      - name: Module OCR français de Windows
        if: runner.os == 'Windows' && env.PASSE_COMPLETE == 'true'
        shell: powershell
        run: |
          [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime] | Out-Null
          $langues = [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages | ForEach-Object { $_.LanguageTag }
          Write-Output "Langues OCR avant : $($langues -join ', ')"
          if ($langues -notcontains 'fr-FR') {
            Add-WindowsCapability -Online -Name "Language.OCR~~~fr-FR~0.0.1.0"
          }

      # Poppler (pdftotext, pdfinfo) sert aux critères d'acceptation de EX-30 et EX-33.
      - name: Poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Poppler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command pdftotext -ErrorAction SilentlyContinue)) { choco install poppler -y --no-progress }
          Get-Command pdftotext, pdfinfo -ErrorAction SilentlyContinue | Format-Table Name, Source

      - name: Installation (environnement verrouillé)
        run: uv sync --locked --python 3.12

      # « verifier » renvoie 3 sous Linux (système non pris en charge pour l'usage) et sous
      # Windows sans module français (passe courante) : attendu.
      - name: Version et diagnostic
        continue-on-error: ${{ runner.os == 'Linux' || (runner.os == 'Windows' && env.PASSE_COMPLETE != 'true') }}
        run: |
          uv run ocr-md --version
          uv run ocr-md verifier

      - name: Tests
        run: uv run pytest -v -ra -s

      # Indicateurs de qualité mesurés avec Apple Vision (EX-76) : nombres seuls, pour le
      # calibrage des seuils ; n'échoue pas la CI.
      - name: Calibrage avec Apple Vision
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: uv run python tests/calibrage.py --moteur systeme
