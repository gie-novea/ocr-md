# Intégration continue d'ocr-md : tests automatisés sur Windows, macOS et Linux.
# - Windows et macOS : niveaux 1 (moteur factice) et 2 (moteurs OCR réels du système).
# - Linux : niveau 1 seulement (pas de moteur OCR du système).
# Python 3.12 est installé et géré par uv, comme sur les postes (EX-09).
#
# Passe complète (« nocturne ») : chaque nuit, sur les étiquettes v* et à la demande.
# - Windows : installation du module OCR français (environ 15 minutes) et tests réels en
#   fr-FR ; aux autres envois, tests réels avec le moteur en-US présent sur l'image.
# - Toutes plateformes : test mémoire sur un lot de 20 fichiers de 500 pages (10 fichiers
#   de 200 pages aux autres envois).
name: tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest      # Apple Silicon
          - macos-15-intel    # Mac Intel (PV-08 b)
          - ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
      PYTHONIOENCODING: utf-8
      PASSE_COMPLETE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"

      - name: Paramètres de la passe
        shell: bash
        run: |
          if [ "$PASSE_COMPLETE" = "true" ]; then
            echo "OCR_MD_ESSAI_LOT=complet" >> "$GITHUB_ENV"
            echo "Passe complète : module fr-FR (Windows) et lot mémoire de 20 x 500 pages"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "OCR_MD_LANGUE_ESSAI=en-US" >> "$GITHUB_ENV"
            echo "Passe courante : moteur Windows réel en en-US"
          fi

      # Passe complète seulement : le module OCR français n'est pas présent sur l'image
      # Windows Server de GitHub ; le runner étant administrateur, on l'installe.
      - name: Module OCR français de Windows
        if: runner.os == 'Windows' && env.PASSE_COMPLETE == 'true'
        shell: powershell
        run: |
          [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime] | Out-Null
          $langues = [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages | ForEach-Object { $_.LanguageTag }
          Write-Output "Langues OCR avant : $($langues -join ', ')"
          if ($langues -notcontains 'fr-FR') {
            Add-WindowsCapability -Online -Name "Language.OCR~~~fr-FR~0.0.1.0"
          }

      # Poppler (pdftotext, pdfinfo) sert aux critères d'acceptation de EX-30 et EX-33.
      - name: Poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Poppler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command pdftotext -ErrorAction SilentlyContinue)) { choco install poppler -y --no-progress }
          Get-Command pdftotext, pdfinfo -ErrorAction SilentlyContinue | Format-Table Name, Source

      - name: Installation (environnement verrouillé)
        run: uv sync --locked --python 3.12

      # « verifier » renvoie 3 sous Linux (système non pris en charge pour l'usage) et sous
      # Windows sans module français (passe courante) : attendu.
      - name: Version et diagnostic
        continue-on-error: ${{ runner.os == 'Linux' || (runner.os == 'Windows' && env.PASSE_COMPLETE != 'true') }}
        run: |
          uv run ocr-md --version
          uv run ocr-md verifier

      - name: Tests
        run: uv run pytest -v -ra -s

      # Indicateurs de qualité mesurés avec Apple Vision (EX-76) : nombres seuls, pour le
      # calibrage des seuils ; n'échoue pas la CI.
      - name: Calibrage avec Apple Vision
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: uv run python tests/calibrage.py --moteur systeme

      # Performance sur le lot type (EX-58) : passe complète seulement (durée de l'OCR réel de
      # 300 pages, environ 10 à 15 minutes sous macOS).
      - name: Performance sur le lot type
        if: env.PASSE_COMPLETE == 'true' && runner.os != 'Linux'
        run: uv run python tests/perf/lot_type.py

      # Scripts d'installation, de mise à jour et de désinstallation (EX-69, EX-72, EX-73) :
      # installation réelle dans le profil depuis l'archive GitHub de ce commit (sans Git),
      # seconde installation sans doublon, mise à jour, puis désinstallation complète.
      - name: Installation, mise à jour, désinstallation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OCR_MD_SANS_PAUSE: "1"
          OCR_MD_SOURCE: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: |
          $sendto = Join-Path $env:APPDATA "Microsoft\Windows\SendTo"
          function Get-Raccourcis { @(Get-ChildItem -LiteralPath $sendto -Filter "OCR - *.lnk") }
          installation\installer-windows.cmd
          if ($LASTEXITCODE -ne 0) { throw "installation en échec" }
          (Get-Raccourcis).Name
          if ((Get-Raccourcis).Count -ne 3) { throw "trois raccourcis attendus" }
          foreach ($d in (uv tool dir), (uv python dir)) { "poids : {0:N0} Mo  {1}" -f ((Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1MB), $d }
          installation\installer-windows.cmd
          if ($LASTEXITCODE -ne 0 -or (Get-Raccourcis).Count -ne 3) { throw "seconde installation en échec ou doublon" }
          installation\mettre-a-jour-windows.cmd
          if ($LASTEXITCODE -ne 0) { throw "mise à jour en échec" }
          installation\desinstaller-windows.cmd -SupprimerConfiguration oui -DesinstallerUv non
          if ($LASTEXITCODE -ne 0) { throw "désinstallation en échec" }
          if ((Get-Raccourcis).Count -ne 0) { throw "raccourcis restants" }
          if (uv tool list | Select-String "ocr-md") { throw "outil encore installé" }

      - name: Installation, mise à jour, désinstallation (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          OCR_MD_SANS_PAUSE: "1"
          OCR_MD_SOURCE: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: |
          set -e
          compter() { ls -d "$HOME/Library/Services/OCR - "*.workflow 2>/dev/null | wc -l | tr -d ' '; }
          ./installation/installer-macos.command
          ls "$HOME/Library/Services"
          [ "$(compter)" = "3" ] || { echo "trois Actions rapides attendues"; exit 1; }
          for w in "$HOME/Library/Services/OCR - "*.workflow; do plutil -lint "$w/Contents/document.wflow" "$w/Contents/Info.plist"; done
          du -sh "$(uv tool dir)" "$(uv python dir)" | sed 's/^/poids : /'
          ./installation/installer-macos.command
          [ "$(compter)" = "3" ] || { echo "doublon après la seconde installation"; exit 1; }
          ./installation/mettre-a-jour-macos.command
          ./installation/desinstaller-macos.command oui non
          [ "$(compter)" = "0" ] || { echo "Actions rapides restantes"; exit 1; }
          if uv tool list | grep -q "ocr-md"; then echo "outil encore installé"; exit 1; fi
